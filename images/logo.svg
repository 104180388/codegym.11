<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
    <defs>
        <linearGradient id="shield_grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#b45309"/>
        </linearGradient>
        <filter id="logo_glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <!-- Shield -->
    <path d="M80 15 L135 35 L135 90 C135 125 80 148 80 148 C80 148 25 125 25 90 L25 35 Z" fill="#090d16" stroke="url(#shield_grad)" stroke-width="4" filter="url(#logo_glow)"/>
    <path d="M80 25 L125 42 L125 88 C125 116 80 136 80 136 C80 136 35 116 35 88 L35 42 Z" fill="#1e293b" opacity="0.6"/>
    <!-- Code Brackets inside -->
    <text x="56" y="85" font-family="monospace" font-size="34" font-weight="900" fill="#fbbf24" text-anchor="middle">&lt;</text>
    <text x="104" y="85" font-family="monospace" font-size="34" font-weight="900" fill="#fbbf24" text-anchor="middle">&gt;</text>
    <text x="80" y="80" font-family="monospace" font-size="28" font-weight="900" fill="#f43f5e" text-anchor="middle">/</text>
    <text x="80" y="112" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="1">20/11</text>
</svg>