<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 640" width="440" height="640">
    <defs>
        <linearGradient id="card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#100829"/>
            <stop offset="50%" stop-color="#1d0e42"/>
            <stop offset="100%" stop-color="#080a12"/>
        </linearGradient>
        <linearGradient id="theme_grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>
        <radialGradient id="core_grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1d0e42"/>
            <stop offset="100%" stop-color="#100829"/>
        </radialGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <pattern id="grid_pattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        </pattern>
    </defs>

    <!-- Nền thẻ & Khung chính -->
    <rect width="440" height="640" rx="26" fill="url(#card_bg)"/>
    <rect width="440" height="640" rx="26" fill="url(#grid_pattern)"/>
    <rect x="10" y="10" width="420" height="620" rx="22" fill="none" stroke="#6366f1" stroke-width="3" filter="url(#glow)"/>
    <rect x="16" y="16" width="408" height="608" rx="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- 1. Thanh tiêu đề trên cùng (Top Bar) -->
    <text x="28" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#6366f1" letter-spacing="1.5">CODEGYM 20/11</text>
    
    <!-- Huy hiệu Rarity Pill Badge (Chữ 11.5px, căn giữa chuẩn, đệm lề 35px cực rộng rãi) -->
    <rect x="258.8" y="22" width="153.2" height="28" rx="14" fill="url(#theme_grad)"/>
    <text x="335.4" y="40.5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle">SR • CG-SR-04</text>

    <!-- 2. Khung Tên & Chức Danh (Chữ to 22.5px) -->
    <text x="220" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="22.5" font-weight="900" fill="#ffffff" text-anchor="middle">Bùa Merge Thẳng Main</text>
    <rect x="115.0" y="84" width="210.0" height="26" rx="13" fill="rgba(15, 23, 42, 0.85)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
    <text x="220" y="102" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="bold" fill="#ec4899" text-anchor="middle">Vật Phẩm Hộ Mệnh Git</text>

    <!-- 3. Khung Đồ Họa Vector Trung Tâm (Art Viewport) -->
    <rect x="30" y="116" width="380" height="130" rx="14" fill="#060912" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <g transform="translate(120, 114)">
        
            <circle cx="100" cy="65" r="46" fill="url(#core_grad)" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
            <line x1="82" y1="43" x2="82" y2="89" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
            <circle cx="82" cy="50" r="4" fill="#6366f1" stroke="#e0e7ff" stroke-width="1.5"/>
            <circle cx="82" cy="82" r="4" fill="#6366f1" stroke="#e0e7ff" stroke-width="1.5"/>
            <path d="M82 72 C96 72 110 65 110 55 L110 43" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
            <circle cx="110" cy="43" r="4" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1.5"/>
            <text x="100" y="103" font-family="'Segoe UI', monospace" font-size="8" font-weight="900" fill="#c7d2fe" text-anchor="middle">MERGE WITHOUT CHECK</text>
        
    </g>

    <!-- 4. Khung 4 Chỉ Số Lưới 2x2 (Chữ 16px số to, nhãn 12px đậm, cực rõ) -->
    <g transform="translate(30, 254)">
        <!-- Ô Chỉ Số 1 -->
        <rect x="0" y="0" width="185" height="44" rx="9" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(255,255,255,0.08)"/>
        <text x="14" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Xung đột code</text>
        <text x="14" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#6366f1">0%</text>

        <!-- Ô Chỉ Số 2 -->
        <rect x="195" y="0" width="185" height="44" rx="9" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(255,255,255,0.08)"/>
        <text x="209" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">May mắn</text>
        <text x="209" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#6366f1">+777%</text>

        <!-- Ô Chỉ Số 3 -->
        <rect x="0" y="48" width="185" height="44" rx="9" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(255,255,255,0.08)"/>
        <text x="14" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Tránh va chạm</text>
        <text x="14" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#6366f1">Tuyệt đối</text>

        <!-- Ô Chỉ Số 4 -->
        <rect x="195" y="48" width="185" height="44" rx="9" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(255,255,255,0.08)"/>
        <text x="209" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8">Độ ngầu</text>
        <text x="209" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#6366f1">Cực đỉnh</text>
    </g>

    <!-- 5. Khung Câu Nói Bất Hủ (Chữ 13px - 14px to rõ) -->
    <rect x="30" y="354" width="380" height="52" rx="10" fill="rgba(10, 15, 26, 0.95)" stroke="rgba(255,255,255,0.08)"/>
    <text x="220" y="375" font-family="'Segoe UI', Roboto, Georgia, serif" font-size="13" font-style="italic" font-weight="bold" fill="#f8fafc" text-anchor="middle">
            <tspan x="220" dy="0">“Chỉ dành cho những ai có nhân phẩm siêu cấp vô</tspan>
            <tspan x="220" dy="19">địch!”</tspan>
        </text>

    <!-- 6. Khung Lời Chúc Tri Ân 20/11 (Chữ 13.5px đậm nét, màu trắng sáng tương phản cao) -->
    <rect x="30" y="414" width="380" height="174" rx="12" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5"/>
    <path d="M44 427 L50 433 L44 439" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="58" y="437" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#fbbf24" letter-spacing="1">💌 LỜI CHÚC TRI ÂN 20/11</text>
    <line x1="44" y1="447" x2="396" y2="447" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>

    <text x="46" y="472" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff">
        <tspan x="46" dy="0">Chúc tình thầy trò luôn hòa hợp, không bao giờ</tspan><tspan x="46" dy="22">có xung đột (conflict) như dòng code trôi</tspan><tspan x="46" dy="22">mượt!</tspan>
    </text>

    <!-- 7. Footer Watermark & Serial -->
    <line x1="30" y1="598" x2="410" y2="598" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="220" y="618" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle" letter-spacing="1.5">✦ HỘI SĂN THẺ MENTOR SSR • CG-SR-04 • CODEGYM 20/11 ✦</text>
</svg>